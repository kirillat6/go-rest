        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_kirillat6_go-rest_internal_core_transport_http_response.ErrorResponse'
      summary: Поиск задачи
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: Изменение информации об уже существующей в системе задаче
      parameters:
      - description: ID изменяемой задачи
        in: path
        name: id
        required: true
