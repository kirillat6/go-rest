paths:
  /statistics:
    get:
      description: Получение статистики по задачам с опциональной фильтрацией по user_id
        и/или временному промежутку времени
      parameters:
      - description: Фильтрация статистики по конкретному пользователю
        in: query
        name: user_id
        type: integer
      - description: Начало промежутка рассмотрения статистики (включительно)
        in: query
        name: from
        type: string
      - description: Конец промежутка рассмотрения статистики (не включительно)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение статистики
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_kirillat6_go-rest_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_kirillat6_go-rest_internal_core_transport_http_response.ErrorResponse'
      summary: Получение статистики
      tags:
      - statistics
  /tasks:
    get:
      description: Поиск всех имеющихся задач с опциональной пагинацией и/или лфильтрацией
        по ID автора задачи
      parameters:
      - description: Размер страницы с задачами
        in: query
        name: limit
        type: integer
      - description: Размер страницы с задачами
        in: query
        name: user_id
        type: integer
      - description: Смещение страницы с задачами
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Задачи успешно найдены
          schema:
            items:
              $ref: '#/definitions/internal_features_tasks_transport_http.TaskDTOResponse'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_kirillat6_go-rest_internal_core_transport_http_response.ErrorResponse'
        "500":
