      responses:
        "201":
          description: Успешно созданная задача
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_kirillat6_go-rest_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Author not found
